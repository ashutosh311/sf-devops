name: Release

# Builds and publishes every Slalom SDLC release asset — the VS Code extension
# (VSIX), standalone CLI binaries, the instruction bundle, the Claude Code
# plugin, and the GitHub Copilot pack — from a single git tag. The tag is the
# only source of truth for the release version: no package.json bump, no local
# script to run or remember.
#
# Release process:
#   1. Merge your changes into main.
#   2. Tag the merged commit and push the tag:
#        git tag v1.2.3
#        git push origin v1.2.3
#   3. This workflow builds, packages, and publishes the release automatically.
#
# Dry-run / pre-merge validation:
#   Tag any commit — including one still on a feature branch or open PR — with
#   a semver pre-release suffix, e.g. `v1.2.3-rc.1`, and push it. The full
#   pipeline (build, typecheck, package VSIX/CLI/instructions) runs exactly as
#   it would for the real release, so a red build surfaces before you merge
#   instead of after. This bypasses the "tag must be on main" check, and
#   publishes a GitHub prerelease (not marked "latest"), so it's never picked
#   up by the VS Code extension's auto-sync or by anyone installing "latest".
#   Plain `vX.Y.Z` tags (no suffix) still require the tag to be on main.
#
# For local/dev builds that don't need a real version number, see
# tools/slalom-sdlc/README.md → "Local builds".

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and republish (e.g. v1.2.3 or v1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: write # required to create releases and upload assets

defaults:
  run:
    working-directory: tools/slalom-sdlc

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        working-directory: .
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid release tag (expected vX.Y.Z or vX.Y.Z-rc.N)." >&2
            exit 1
          fi
          if [[ -n "${BASH_REMATCH[1]}" ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (version ${TAG#v}, prerelease=${PRERELEASE})"

      - name: Verify tag is reachable from main
        if: steps.version.outputs.prerelease != 'true'
        working-directory: .
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ steps.version.outputs.tag }}" origin/main; then
            echo "Tag ${{ steps.version.outputs.tag }} is not on main — refusing to release from an unmerged commit." >&2
            echo "For a pre-merge dry run, use a pre-release tag instead, e.g. ${{ steps.version.outputs.tag }}-rc.1" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tools/slalom-sdlc/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp release version
        run: node scripts/sync-version.mjs --version "${{ steps.version.outputs.version }}"

      - name: Build packages
        env:
          # SAS URL for the usage-tracking Power Automate trigger — the credential
          # itself. Only ever present in this CI env; never committed. Compiled
          # into the vscode package's dist/extension.js at build time via
          # esbuild's `define` (see packages/vscode/esbuild.mjs and
          # packages/vscode/src/usage.ts). Requires a repo secret named
          # USAGE_TRACKING_ENDPOINT_URL under Settings → Secrets and variables →
          # Actions. If unset, this compiles in "" and usage tracking stays off.
          SLALOM_SDLC_USAGE_ENDPOINT: ${{ secrets.USAGE_TRACKING_ENDPOINT_URL }}
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Verify Copilot agents are in sync
        run: node scripts/generate-copilot-agents.mjs --check

      - name: Package VS Code extension (VSIX)
        env:
          # Same secret as the "Build packages" step above — this step re-runs
          # esbuild (via the package script's `pnpm build`) before invoking vsce,
          # so it needs the env var again for the final VSIX to have it compiled in.
          SLALOM_SDLC_USAGE_ENDPOINT: ${{ secrets.USAGE_TRACKING_ENDPOINT_URL }}
        run: pnpm --filter slalom-sdlc package

      - name: Package CLI binaries
        run: pnpm --filter @sdlc/cli package

      - name: Package instruction bundle
        run: node scripts/package-instructions.mjs --version "${{ steps.version.outputs.version }}"

      - name: Package Claude Code plugin
        run: node scripts/package-plugin.mjs --version "${{ steps.version.outputs.version }}"

      - name: Package Copilot pack
        run: node scripts/package-copilot.mjs --version "${{ steps.version.outputs.version }}"

      - name: Verify assets
        run: |
          test -f dist/release/instructions.zip
          test -f dist/release/manifest.json
          test -f dist/release/slalom-sdlc-plugin.zip
          test -f dist/plugin/server/server.js
          test -f dist/plugin/.mcp.json
          test -f dist/release/slalom-sdlc-copilot.zip
          test -f dist/copilot/server/server.js
          test -f dist/copilot/install.sh
          ls dist/copilot/agents/*.agent.md
          ls packages/vscode/*.vsix
          ls packages/cli/binaries/*
          ls -lh dist/release packages/vscode/*.vsix packages/cli/binaries/*

      # Claude Code installs plugins by cloning, not by downloading an asset, so the
      # built server bundle has to exist at a git ref. `plugin-dist` is that ref: a
      # branch holding only the assembled plugin, republished here on every release.
      # The marketplace entry in the repo-root .claude-plugin/marketplace.json points
      # at it, so `claude plugin update slalom-sdlc` picks this up with no other moving
      # parts. Skipped for pre-releases — a dry-run tag must never become what plugin
      # users install, exactly like `make_latest: false` on the release itself.
      - name: Publish plugin to plugin-dist branch
        if: steps.version.outputs.prerelease != 'true'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WORK="$RUNNER_TEMP/plugin-dist"

          # Reuse the existing branch where there is one so consumers' clones can
          # fast-forward; create it from scratch on the first release.
          if git ls-remote --exit-code --heads "$REMOTE" plugin-dist >/dev/null 2>&1; then
            git clone --depth 1 --branch plugin-dist "$REMOTE" "$WORK"
          else
            mkdir -p "$WORK"
            git -C "$WORK" init -q -b plugin-dist
            git -C "$WORK" remote add origin "$REMOTE"
          fi

          rm -rf "$WORK/plugin"
          cp -R tools/slalom-sdlc/dist/plugin "$WORK/plugin"

          cat > "$WORK/README.md" <<EOF
          # plugin-dist

          Generated branch — do not edit by hand, and do not merge it into \`main\`.

          It holds the built Claude Code plugin (\`plugin/\`) for the current release,
          republished by \`.github/workflows/release.yml\` on every \`vX.Y.Z\` tag. The
          plugin source lives at \`tools/slalom-sdlc/plugin/\` on \`main\`; the bundled
          server at \`plugin/server/server.js\` is built from \`tools/slalom-sdlc/packages/mcp\`.

          Install: \`claude plugin marketplace add ${GITHUB_REPOSITORY}\`

          Current release: ${TAG}
          EOF

          git -C "$WORK" config user.name  "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add -A

          if git -C "$WORK" diff --cached --quiet; then
            echo "plugin-dist already matches ${TAG} — nothing to publish."
            exit 0
          fi

          git -C "$WORK" commit -q -m "release: slalom-sdlc plugin ${TAG}"
          git -C "$WORK" push origin plugin-dist
          echo "Published plugin ${TAG} to plugin-dist."

      # GitHub's "immutable releases" feature locks a release's assets and tag as
      # soon as it's published — asset uploads are only allowed while a release is
      # still a draft. softprops/action-gh-release creates the release object and
      # then uploads assets in separate API calls, so if it created the release
      # already published, the asset uploads land on an immutable release and fail
      # ("Cannot upload asset ... to an immutable release"). Create as a draft here
      # (mutable, assets attach fine) and publish it explicitly in the next step —
      # this repo has no downstream workflow keyed on release.prereleased, so
      # publishing via a separate step (which fires release.published either way)
      # doesn't lose anything.
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.prerelease == 'true' && format('Slalom SDLC {0} (pre-merge dry run — not for install)', steps.version.outputs.tag) || format('Slalom SDLC {0}', steps.version.outputs.tag) }}
          body: |
            ${{ steps.version.outputs.prerelease == 'true' && 'Pre-merge dry-run build — validates the release pipeline from an unmerged commit. Not marked "latest"; the VS Code extension will never auto-sync to this.' || 'Automated release, built entirely from this tag — no manual version bump involved.' }}

            - **`*.vsix`** — the VS Code extension. Install via the Extensions panel → `···` → *Install from VSIX…* (first-time setup).
            - **`slalom-sdlc-*`** — standalone CLI binaries (macOS/Windows/Linux) for headless or non-VS Code use.
            - **`instructions.zip`** — the instruction bundle the installed extension downloads automatically on its daily background sync.
              Every file is checksum-validated against `manifest.json` before activation.
            - **`slalom-sdlc-plugin.zip`** — the Claude Code plugin, for manual or air-gapped install.
              Normally you don't need this file: `claude plugin marketplace add Slalom/salesforce-devops`
              then `claude plugin install slalom-sdlc@slalom`, and `claude plugin update slalom-sdlc` thereafter.
            - **`slalom-sdlc-copilot.zip`** — the GitHub Copilot pack (CLI + desktop app). Unzip and run
              `./install.sh` to add the SDLC agents at the user level (`~/.copilot/agents/`), then invoke
              them in any project with `/agent slalom-about` (or discover/refine/design/build/test/release).
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            tools/slalom-sdlc/dist/release/instructions.zip
            tools/slalom-sdlc/dist/release/manifest.json
            tools/slalom-sdlc/dist/release/slalom-sdlc-plugin.zip
            tools/slalom-sdlc/dist/release/slalom-sdlc-copilot.zip
            tools/slalom-sdlc/packages/vscode/*.vsix
            tools/slalom-sdlc/packages/cli/binaries/*

      - name: Publish GitHub Release
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --repo "${{ github.repository }}"

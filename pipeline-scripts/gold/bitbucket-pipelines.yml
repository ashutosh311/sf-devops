# Author: Stuart Grieve (Slalom)

# Docker image to be used
image: 
  name: salesforce/cli:latest-full
  run-as-user: 0

# Maximum minutes a step can execute before timing out
options:
  max-time: 120

definitions:

  scripts:
    
    # Utility commands
    branchJiraReferenceCheck: &branchJiraReferenceCheck if [[ $BITBUCKET_BRANCH != *'<jira-project-shortcode>'* ]]; then echo "Branch name does not contain a Jira ticket reference"; exit 1; fi
    generateDelta: &generateDelta utilities/generate-delta.sh "delta-directory" "$ENV_COMMIT_ID" "$BITBUCKET_BRANCH"
    getEnvConfigCustomSetting: &getEnvConfigCustomSetting source utilities/get-env-config-custom-setting.sh "$SF_USERNAME"
    importSingleConfigFile: &importSingleConfigFile sf data upsert bulk --sobject "$SObject" --file "$File" --external-id "$ExternalId" --target-org "$SF_USERNAME" --wait 15
    sfAuthenticate: &sfAuthenticate utilities/sf-authenticate.sh "$SF_USERNAME" "$SF_CONSUMER_KEY" "$SF_URL" "$SF_DECRYPT_KEY" "$SF_DECRYPT_IV" "$SF_SERVER_KEY"
    sfCodeAnalyze: &sfCodeAnalyze utilities/sf-code-analyze.sh "delta-directory"
    sfValidate: &sfValidate utilities/sf-deploy.sh "validate" "$SF_USERNAME" "true" "delta-directory/force-app" "" ""

pipelines:

  pull-requests:

    feature/*:
      - step:
          name: Feature Validation
          script:
            - if [ $BITBUCKET_PR_DESTINATION_BRANCH != "develop" ]; then echo feature/ branches can only be merged into the develop branch; exit 1; fi
            - *branchJiraReferenceCheck
            - source utilities/set-env-variables.sh "QA"
            - *sfAuthenticate
            - *getEnvConfigCustomSetting
            - *generateDelta
            - *sfCodeAnalyze
            - *sfValidate
    
    hotfix/*:
      - step:
          name: Hotfix Validation
          script:
            - if [ $BITBUCKET_PR_DESTINATION_BRANCH != "release" ]; then echo hotfix/ branches can only be merged into the release branch; exit 1; fi
            - *branchJiraReferenceCheck
            - source utilities/set-env-variables.sh "UAT"
            - *sfAuthenticate
            - *getEnvConfigCustomSetting
            - *generateDelta
            - *sfCodeAnalyze
            - *sfValidate
  
  branches:

    develop:
      - step:
          name: QA Sandbox Merge Deploy
          script:
            - source utilities/set-env-variables.sh QA
            - *sfAuthenticate
            - *getEnvConfigCustomSetting
            - *generateDelta
            - utilities/sf-deploy.sh "deploy" "$SF_USERNAME" "true" "delta-directory/force-app" "$BITBUCKET_BRANCH" ""

  custom:

    sit-validate:
      - step:
          name: "Validate Release to SIT"
          script:
            - if [[ $BITBUCKET_BRANCH != release/* ]]; then echo The sit-validate pipeline should only be run from a release/ branch; exit 1; fi
            - source utilities/set-env-variables.sh SIT
            - *sfAuthenticate
            - *getEnvConfigCustomSetting
            - *generateDelta
            - *sfValidate

    uat-validate:
      - step:
          name: "Validate Release to UAT"
          script:
            - if [[ $BITBUCKET_BRANCH != release/* ]]; then echo The uat-validate pipeline should only be run from a release/ branch; exit 1; fi
            - source utilities/set-env-variables.sh UAT
            - *sfAuthenticate
            - *getEnvConfigCustomSetting
            - *generateDelta
            - *sfValidate

    production-validate:
      - step:
          name: "Validate Release to Production"
          script:
            - if [[ $BITBUCKET_BRANCH != release/* ]]; then echo The production-validate pipeline should only be run from a release/ branch; exit 1; fi
            - source utilities/set-env-variables.sh Production
            - *sfAuthenticate
            - *getEnvConfigCustomSetting
            - *generateDelta
            - *sfValidate
    
    sit-deploy:
      - step:
          name: "Deploy Release to SIT"
          deployment: SIT
          script:
            - if [[ $BITBUCKET_BRANCH != release/* ]]; then echo The sit-deploy pipeline should only be run from a release/ branch; exit 1; fi
            - source utilities/set-env-variables.sh SIT
            - *sfAuthenticate
            - *getEnvConfigCustomSetting
            - *generateDelta
            - utilities/sf-deploy.sh "deploy" "$SF_USERNAME" "true" "delta-directory/force-app" "$BITBUCKET_BRANCH" "SIT"

    uat-deploy:
      - step:
          name: "Deploy Release to UAT"
          deployment: UAT
          script:
            - if [[ $BITBUCKET_BRANCH != release/* ]]; then echo The uat-deploy pipeline should only be run from a release/ branch; exit 1; fi
            - source utilities/set-env-variables.sh UAT
            - *sfAuthenticate
            - *getEnvConfigCustomSetting
            - *generateDelta
            - utilities/sf-deploy.sh "deploy" "$SF_USERNAME" "true" "delta-directory/force-app" "$BITBUCKET_BRANCH" "UAT"

    production-deploy:
      - step:
          name: "Deploy Release to Production"
          deployment: Production
          script:
            - if [[ $BITBUCKET_BRANCH != release/* ]]; then echo The production-deploy pipeline should only be run from a release/ branch; exit 1; fi
            - source utilities/set-env-variables.sh Production
            - *sfAuthenticate
            - *getEnvConfigCustomSetting
            - *generateDelta
            - utilities/sf-deploy.sh "deploy" "$SF_USERNAME" "true" "delta-directory/force-app" "$BITBUCKET_BRANCH" "Production"

    import-all-config-data:
      - variables:
          - name: Environment
            default: "QA"
            allowed-values:
              - "DEV"
              - "QA"
              - "SIT"
              - "UAT"
              - "Production"
              - "HOTFIX"
          - name: Directory
      - step:
          name: "Import Configuration Data"
          script:
            - source utilities/set-env-variables.sh $Environment
            - *sfAuthenticate
            - utilities/import-config-data.sh "$SF_USERNAME" "$Directory"

    import-single-config-data:
      - variables:
          - name: Environment
            default: "QA"
            allowed-values:
              - "DEV"
              - "QA"
              - "SIT"
              - "UAT"
              - "Production"
              - "HOTFIX"
          - name: ExternalId
          - name: File
          - name: SObject
      - step:
          name: "Import Configuration Data"
          script:
            - source utilities/set-env-variables.sh $Environment
            - *sfAuthenticate
            - *importSingleConfigFile

    import-document-templates:
      - variables:
          - name: Environment
            default: "QA"
            allowed-values:
              - "DEV"
              - "QA"
              - "SIT"
              - "UAT"
              - "Production"
              - "HOTFIX"
      - step:
          name: "Import Document Templates"
          script:
            - source utilities/set-env-variables.sh $Environment
            - *sfAuthenticate
            - utilities/document-template-import.sh $Environment